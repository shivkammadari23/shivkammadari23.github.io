name: Build application PDFs
on:
  push:
    branches: [main]
    paths:
      - 'resume-final.tex'
      - 'service-ops-prd-final.tex'
      - '.github/workflows/build-application-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Compile PDFs
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error resume-final.tex
          mv resume-final.pdf resume.pdf
          pdflatex -interaction=nonstopmode -halt-on-error service-ops-prd-final.tex
          mv service-ops-prd-final.pdf service-ops-prd.pdf
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf service-ops-prd.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build updated resume and product requirements PDFs"
            git push
          fi
