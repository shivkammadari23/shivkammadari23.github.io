name: Publish portfolio PDFs
on:
  push:
    branches: [main]
    paths:
      - 'resume-final.tex'
      - 'service-ops-prd-final.tex'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Compile PDFs
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error resume-final.tex
          pdflatex -interaction=nonstopmode -halt-on-error service-ops-prd-final.tex
          cp resume-final.pdf resume.pdf
          cp service-ops-prd-final.pdf service-ops-prd.pdf
      - name: Commit PDFs to the Pages source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf service-ops-prd.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated resume and product requirements PDFs"
            git push origin HEAD:$GITHUB_REF_NAME
          fi